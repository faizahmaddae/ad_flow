name: ad_flow
description: "AdMob integration for Flutter with policy-aware defaults: banner, interstitial, rewarded, rewarded interstitial, native and app open ads with GDPR/UMP consent."
version: 5.3.1
homepage: https://github.com/faizahmaddae/ad_flow
repository: https://github.com/faizahmaddae/ad_flow
issue_tracker: https://github.com/faizahmaddae/ad_flow/issues

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  # 9.2.0 is the floor: it is the first release that actually serves Google's
  # LARGE anchored adaptive banner (the codec dropped the flag before), and it
  # fixes an iOS crash after the app-state stream is cancelled and UMP form
  # presentation in scene-based iOS apps (ADR-078).
  google_mobile_ads: ^9.2.0
  shared_preferences: ^2.5.5
  # iOS App Tracking Transparency, used ONLY for the opt-in client-driven ATT
  # mode (the AttExplainer flow). Android/others degrade to notSupported.
  app_tracking_transparency: ^2.0.6

  # OPTIONAL: Mediation adapters - add only the networks you use.
  # Check each adapter's compatibility with google_mobile_ads 9.x before adding.

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  # In-memory SharedPreferencesAsync backend for KeyValueStore tests.
  shared_preferences_platform_interface: ^2.4.2

# This is a pure Dart package - no native plugin code needed.
# Native functionality comes from google_mobile_ads.
flutter:

platforms:
  android:
  ios:

topics:
  - admob
  - ads
  - monetization
  - gdpr
