# Run on every push and PR to catch issues early.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly as well: CI has no lockfile and tracks Flutter stable, so a new
  # google_mobile_ads release or a new Dart lint can break an unchanged tree.
  # Better to hear about it on Monday than on the next release PR.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests (with coverage)
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info

  # The example must keep compiling against the current API — README/docs
  # claims are only as good as a building example.
  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build example APK (debug)
        working-directory: example
        run: flutter build apk --debug

  # iOS must keep compiling too (the ATT pod + scene-lifecycle requirements
  # only surface on an iOS build).
  example-build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build example iOS (simulator, no codesign)
        working-directory: example
        run: flutter build ios --simulator --debug

  # pub.dev score gate — the package ships at 160/160; don't regress it.
  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run pana
        run: |
          flutter pub global activate pana
          flutter pub global run pana --no-warning --exit-code-threshold 0 .
