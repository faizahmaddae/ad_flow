name: ad_flow
description: "Easy AdMob integration for Flutter with banner, interstitial, rewarded, rewarded interstitial, native & app open ads, plus built-in GDPR/ATT consent management and mediation support."
version: 2.0.0-dev.1
homepage: https://github.com/faizahmaddae/ad_flow
repository: https://github.com/faizahmaddae/ad_flow
issue_tracker: https://github.com/faizahmaddae/ad_flow/issues

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.4

  # OPTIONAL: Mediation adapters - add only the networks you use.
  # Check each adapter's compatibility with google_mobile_ads 9.x before adding.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# This is a pure Dart package - no native plugin code needed.
# Native functionality comes from google_mobile_ads.
flutter:

platforms:
  android:
  ios:

topics:
  - admob
  - ads
  - monetization
  - gdpr
